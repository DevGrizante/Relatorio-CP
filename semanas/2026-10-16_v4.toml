[[noticias]]
titulo = "Régis Bittencourt"
texto = """
As AGDs de APRB18 e APRB28, convocadas para 07/10, não foram instaladas por falta de quórum, com presença de 11,06% e 52,55%, respectivamente; APRB28 tem segunda convocação em 23/10 para deliberar sobre a transferência do controle para a EPR Participações, novas dívidas de até R$ 1,3 bilhão, a liberação integral das garantias reais e a exclusão de eventos de inadimplemento, entre eles o ligado aos índices financeiros, com waiver fee de pelo menos 0,10% flat se aprovada a pauta completa.
