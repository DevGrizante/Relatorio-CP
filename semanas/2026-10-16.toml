# régua: nível 2; Δ negociado —; Δ indicativo 13 bps; peso IDA 0,12%; secundário R$ 4,6 mi
# Atas: 8ª (MILS18) 91,78%; 9ª (MILS19, MILS29) 93,80%; 10ª (MILSA0, MILSB0) 97,84%; 11ª (MILSA1) 96,89% das debêntures em circulação.
# Prêmio = 0,50% a.a. x duration da tabela de tickers: MILS18 1,87 (0,94%); MILS19 1,84 (0,92%); MILS29 3,39 (1,70%);
# MILSA0 2,13 (1,07%); MILSB0 3,58 (1,79%); MILSA1 2,71 (1,36%). Base de cálculo: duration na data do fato relevante de conclusão.
[[noticias]]
titulo = "Mills"
tickers = ["MILS18", "MILS19", "MILS29", "MILSA0", "MILSB0", "MILSA1"]
texto = """
Debenturistas de MILS18, MILS19, MILS29, MILSA0, MILSB0 e MILSA1 aprovaram, em 14 e 15/10, waiver para a troca de controle para a Loxam. Contrapartidas: prêmio de 0,50% a.a. vezes a duration, cerca de 0,9% a 1,8% do saldo pela duration atual, e seller's financing na dívida líquida dos covenants até 09/2029.
Para acompanhar: aprovação do CADE e conclusão.
"""

# fonte: https://www.rad.cvm.gov.br/ENET/frmDownloadDocumento.aspx?Tela=ext&descTipo=IPE&CodigoInstituicao=1&numProtocolo=1577748&numSequencia=1102454&numVersao=2
