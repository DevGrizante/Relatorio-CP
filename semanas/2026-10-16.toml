# fonte: https://www.rad.cvm.gov.br/ENET/frmDownloadDocumento.aspx?Tela=ext&descTipo=IPE&CodigoInstituicao=1&numProtocolo=1577728&numSequencia=1102434&numVersao=1
# régua: nível 2; Δ negociado —; Δ indicativo 11 bps; peso IDA 0,20%; secundário R$ 11,9 mi
# APRB18 = 8ª emissão, 1ª série (venc. 15/06/2031); APRB28 = 8ª emissão, 2ª série (venc. 15/06/2027), conforme tabela de tickers e títulos dos documentos.
# AGDs de 07/10 não instaladas: presença de 11,06% (APRB18) e 52,55% (APRB28).
# APRB18: negociado a NTN-B 2029 + 119 bps contra indicativa ANBIMA de NTN-B 2029 + 85 bps (tabela de tickers).
# Resgate de APRB28 só se aprovados os itens (a) a (f) sem os itens (a) a (q); prêmio do resgate não consta da proposta.
[[noticias]]
titulo = "Régis Bittencourt"
tickers = ["APRB18", "APRB28"]
texto = """
APRB28 terá AGD em segunda convocação em 23/10: troca de controle para a EPR, novas dívidas de até R$ 1,3 bilhão, liberação das garantias reais, saída da Arteris como fiadora e fim do covenant financeiro, com waiver fee mínimo de 0,10% flat. APRB18 negociou longe da marcação ANBIMA.
Para acompanhar: aprovados só os itens (a) a (f), APRB28 é resgatada.
"""

