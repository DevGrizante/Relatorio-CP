texto = """
Debenturistas de MILS18, MILS19, MILS29, MILSA0, MILSB0 e MILSA1 aprovaram, em 14 e 15/10, waiver para a troca de controle sem vencimento antecipado, com adesão entre 91,78% e 97,84% das debêntures em circulação; em contrapartida, prêmio de 0,50% a.a. multiplicado pela duration, pago após a conclusão da operação, e definição temporária de dívida financeira líquida que passa a incluir seller's financing.
