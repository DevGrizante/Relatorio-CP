tickers = ["APRB18", "APRB28"]
texto = """
AGDs de APRB18 e APRB28 de 07/10 não foram instaladas (presença: 11,06% e 52,55%). APRB28 tem segunda convocação em 23/10: troca de controle para a EPR, dívidas de até R$ 1,3 bilhão, liberação das garantias reais e fim do covenant financeiro, com waiver fee mínimo de 0,10% flat.
Para acompanhar: com aprovação parcial, a proposta prevê resgate de APRB28.
"""

